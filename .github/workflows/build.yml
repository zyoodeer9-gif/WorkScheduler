name: Build WorkScheduler EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name WorkScheduler --add-data "index.html;." main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WorkScheduler-Windows
          path: dist/WorkScheduler.exe
